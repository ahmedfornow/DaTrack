name: Build and deploy

on:
  push:
    branches: [main, 'redesign/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The date logic must be identical no matter where the phone thinks it
        # is. A developer machine set to KSA time cannot detect a device-local
        # bug, so the suite runs under a hostile timezone too.
        timezone: [Asia/Riyadh, America/Los_Angeles]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          TZ: ${{ matrix.timezone }}

  build:
    name: Build site
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run build

      # ---------------------------------------------------------------------
      # Assemble the published site.
      #
      # THIS ARTIFACT IS THE ENTIRE SITE. Pages serves the Actions source, so
      # anything missing here is missing from the live site — which is why the
      # guard below runs before publishing rather than after.
      #
      #   /         the rebuild — what the team opens
      #   /legacy/  the previous app, byte-identical to the repo copy, kept as
      #             the fallback until it is retired
      #   /next/    the rebuild's former address; redirects to the root and
      #             unregisters the service worker installed there
      # ---------------------------------------------------------------------
      - name: Assemble site
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p site/legacy site/next
          cp -r app/dist/. site/
          cp index.html site/legacy/index.html
          cp deploy/next-redirect.html site/next/index.html
          # Pages runs Jekyll otherwise, which strips files beginning with "_".
          touch site/.nojekyll

      - name: Verify the assembled site
        working-directory: .
        run: |
          set -euo pipefail

          # --- The rebuild owns the root, and is really the built app --------
          test -f site/index.html
          test -d site/assets
          test -f site/manifest.webmanifest
          test -f site/sw.js
          # Asserting the exact base catches a wrong VITE_BASE, which would
          # otherwise deploy a page whose assets all 404.
          grep -q '/DaTrack/assets/' site/index.html

          # --- The legacy app is intact at its new address -------------------
          # Same bytes as the file in the repo, so a build can never alter it.
          test -f site/legacy/index.html
          diff -q index.html site/legacy/index.html
          grep -q 'DaTracker' site/legacy/index.html

          # --- The old address still resolves and sends people forward -------
          # A bare 404 here would strand every phone that installed the app
          # from /next/ on a cached build that never updates again.
          test -f site/next/index.html
          grep -q 'serviceWorker' site/next/index.html
          grep -q 'url=../' site/next/index.html
          # No service worker script at the old scope: a 404 on the update
          # check is what makes browsers drop the stale registration.
          test ! -f site/next/sw.js

          echo "rebuild at /, legacy $(wc -c < site/legacy/index.html) bytes at /legacy/, /next/ redirects"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    # Only main publishes. Branch pushes build and test but never touch the
    # live site.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
